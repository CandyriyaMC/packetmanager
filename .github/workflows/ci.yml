# CI for packetmanager — bun + typescript.
# Triggers: push to dev, and pull_request targeting dev/main.
# No secrets are referenced anywhere in this workflow on purpose:
# publish credentials (PM_API_KEY) do NOT belong in CI for this phase, deploys are out of scope.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # cancel superseded runs on the same PR/branch, humans rebase a lot
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # keep this in sync with what devs run locally; bun.lock uses lockfileVersion 2
  BUN_VERSION: "1.4.4"

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1 — pinned by commit SHA, not @v7, so a moved tag can't silently change what runs
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # oven-sh/setup-bun v2.2.0 — pinned by commit SHA for the same reason
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # actions/cache v6.1.0 — pinned by commit SHA for the same reason
      # note: setup-bun caches the bun binary itself, not the dependency cache — that's what this does
      - name: Cache bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Show versions
        run: |
          echo "+ bun --version"
          bun --version
      - name: Install dependencies
        run: |
          echo "+ bun install --frozen-lockfile"
          bun install --frozen-lockfile

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: |
          echo "+ bun install --frozen-lockfile"
          bun install --frozen-lockfile
      - name: Typecheck
        run: |
          echo "+ bunx tsc --noEmit"
          bunx tsc --noEmit

  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: |
          echo "+ bun install --frozen-lockfile"
          bun install --frozen-lockfile
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          echo "+ looking for test files"
          # bun's own matcher: *.test.* / *.spec.* (plus _test_/_spec_ variants)
          tests="$(git ls-files | grep -E '\.(test|spec)\.[jt]sx?$|_(test|spec)_\.[jt]sx?$' || true)"
          if [ -z "$tests" ]; then
            echo "no test files yet — bun test exits 1 on an empty match, so this is a friendly no-op"
            exit 0
          fi
          echo "found:"
          echo "$tests"
          echo "+ bun test"
          bun test
